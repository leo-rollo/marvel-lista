    filter:brightness(0.22) saturate(0.6);z-index:0;
  }
  .header-overlay{
    position:absolute;inset:0;
    background:linear-gradient(180deg,rgba(10,2,4,.45) 0%,rgba(10,2,4,.15) 40%,rgba(10,2,4,.55) 80%,rgba(10,2,4,.95) 100%);
    z-index:1;
  }
  .header-content{position:relative;z-index:2;width:100%;}
  h1{
    font-family:'Barlow Condensed',sans-serif;font-weight:900;
    font-size:clamp(.85rem,2.8vw,1.6rem);
    letter-spacing:.32em;line-height:1;
    text-shadow:0 0 40px rgba(227,28,35,.35),0 2px 12px rgba(0,0,0,.9);
    text-transform:uppercase;color:rgba(232,232,240,.82);
    margin-bottom:6px;
  }
  .marvel-logo{margin:0 auto 8px;width:clamp(130px,38vw,240px);display:block;}
  .marvel-logo img{width:100%;height:auto;display:block;}
  .subtitle{font-size:clamp(.6rem,.75vw + .4rem,.75rem);letter-spacing:.22em;color:rgba(232,232,240,.5);margin-top:8px;text-transform:uppercase;text-shadow:0 1px 8px rgba(0,0,0,.9);}

  /* ── STATS ── */
  .stats-bar{
    display:flex;justify-content:center;gap:clamp(16px,5vw,36px);
    padding:14px 12px;background:var(--surface);
    border-bottom:1px solid #1e1e2e;flex-wrap:wrap;
  }
  .stat{text-align:center;}
  .stat-num{font-family:'Bebas Neue',sans-serif;font-size:1.7rem;color:var(--gold-light);line-height:1;}
  .stat-lbl{font-size:.62rem;letter-spacing:.15em;color:var(--text-muted);text-transform:uppercase;}

  /* ── PROGRESS ── */
  .progress-wrap{background:var(--surface);padding:0 16px 12px;border-bottom:1px solid #1e1e2e;}
  .bar-bg{background:#1c1c2e;border-radius:99px;height:5px;max-width:760px;margin:0 auto;overflow:hidden;}
  .bar-fill{height:100%;background:linear-gradient(90deg,var(--red-dark),var(--red),var(--gold));border-radius:99px;transition:width .5s ease;}

  /* ── CONTROLS ── */
  .controls{
    display:flex;gap:6px;padding:8px 10px;
    justify-content:center;flex-wrap:wrap;
    background:var(--surface);border-bottom:1px solid #1e1e2e;
    position:sticky;top:0;z-index:10;
  }
  .search-wrap{
    flex:1 1 100%;display:flex;align-items:center;position:relative;
    margin-bottom:2px;
  }
  .search-wrap input{
    width:100%;background:#0d0d18;border:1px solid #2e2e48;
    color:var(--text);padding:7px 28px 7px 10px;border-radius:3px;
    font-family:'Barlow',sans-serif;font-size:.8rem;outline:none;transition:border-color .18s;
  }
  .search-wrap input::placeholder{color:var(--text-muted);}
  .search-wrap input:focus{border-color:var(--red);}
  .search-clear{position:absolute;right:8px;background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:.85rem;padding:0;display:none;}
  .search-clear.visible{display:block;}
  .fbtn{
    background:transparent;border:1px solid #2e2e48;color:var(--text-muted);
    padding:5px 10px;border-radius:3px;cursor:pointer;
    font-family:'Barlow',sans-serif;font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;transition:all .18s;
    flex:0 0 auto;
  }
  .fbtn:hover,.fbtn.on{border-color:var(--red);color:var(--text);background:rgba(227,28,35,.1);}
  .abtn{
    padding:5px 10px;border-radius:3px;cursor:pointer;flex:0 0 auto;
    font-family:'Barlow',sans-serif;font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;transition:all .18s;border:1px solid;
  }
  .abtn.green{background:rgba(45,122,45,.12);border-color:#2d7a2d;color:#6ec46e;}
  .abtn.green:hover{background:rgba(45,122,45,.28);}
  .abtn.crimson{background:rgba(227,28,35,.08);border-color:var(--red-dark);color:#d06060;}
  .abtn.crimson:hover{background:rgba(227,28,35,.18);}
  .abtn.next{background:rgba(201,150,12,.08);border-color:var(--gold);color:var(--gold-light);}
  .abtn.next:hover{background:rgba(201,150,12,.18);}

  /* ── ERA ── */
  .era-block{max-width:880px;margin:0 auto;width:100%;}
  .era-header{display:flex;align-items:center;gap:10px;padding:22px 12px 6px;}
  .era-label{font-family:'Bebas Neue',sans-serif;font-size:.78rem;letter-spacing:.18em;color:var(--red);white-space:nowrap;flex-shrink:0;}
  .era-line{flex:1;height:1px;background:linear-gradient(90deg,var(--red-dark),transparent);min-width:10px;}
  .era-title{font-family:'Bebas Neue',sans-serif;font-size:1.2rem;letter-spacing:.08em;flex-shrink:1;min-width:0;}
  .era-desc{font-size:.7rem;color:var(--text-muted);font-style:italic;padding:0 12px 4px;border-left:2px solid #2a2a40;margin:0 12px 2px;}
  .era-progress{display:flex;align-items:center;gap:8px;padding:0 12px 8px;font-size:.62rem;color:var(--text-muted);}
  .era-bar-bg{flex:1;max-width:180px;height:3px;background:#1c1c2e;border-radius:99px;overflow:hidden;}
  .era-bar-fill{height:100%;background:linear-gradient(90deg,var(--red-dark),var(--gold));border-radius:99px;transition:width .4s ease;}

  /* ── ITEMS ── */
  .items{display:flex;flex-direction:column;gap:3px;padding:0 10px 16px;}

  /* ── ROW ── */
  .row{
    background:var(--surface);
    border:1px solid #1c1c2c;border-left:3px solid transparent;
    border-radius:3px;transition:border-color .18s,background .18s;
    position:relative;cursor:pointer;
  }
  .row:hover{border-color:#28283c;border-left-color:var(--red);background:#13131c;}
  .row.done{background:var(--watched-bg);border-color:#1e451e;border-left-color:#3daa3d;}
  .row.done .rtitle{color:#8ccc8c;}
  .row.done .rnum{color:#3daa3d;}
  .row.expanded{border-left-color:var(--gold);border-color:#2e2e20;background:#141410;}
  .row.expanded.done{border-left-color:#3daa3d;}
  .row.hidden{display:none;}
  .row.next-up{border-left-color:var(--gold)!important;box-shadow:0 0 12px rgba(201,150,12,.15) inset;}
  .row.next-up .rnum{color:var(--gold-light);}

  /* ── ROW TOP ── */
  .row-top{display:flex;align-items:center;gap:10px;padding:10px 12px;}
  .rnum{font-family:'Bebas Neue',sans-serif;font-size:.95rem;color:var(--text-muted);min-width:22px;text-align:right;flex-shrink:0;}
  .rico{font-size:.95rem;width:18px;text-align:center;flex-shrink:0;}
  .rinfo{flex:1;min-width:0;}
  .rtitle{font-size:.85rem;font-weight:600;line-height:1.25;}
  .rmeta{display:flex;align-items:center;gap:5px;margin-top:3px;flex-wrap:wrap;}

  .badge{font-size:.58rem;letter-spacing:.08em;text-transform:uppercase;padding:1px 5px;border-radius:2px;font-weight:700;}
  .b-film{background:rgba(227,28,35,.18);color:#ff7070;}
  .b-serie{background:rgba(110,80,220,.2);color:#b0a0ff;}
  .b-especial{background:rgba(201,150,12,.18);color:var(--gold-light);}
  .b-animacao{background:rgba(0,160,210,.18);color:#70d8ff;}
  .b-short{background:rgba(80,180,120,.18);color:#80e8a0;}
  .b-extras{background:rgba(80,80,80,.25);color:#aaaacc;}

  .ryear{font-size:.67rem;color:var(--text-muted);}
  .rstream{font-size:.63rem;color:var(--text-muted);font-style:italic;}
  .rnote{font-size:.6rem;color:var(--gold);background:rgba(201,150,12,.1);border:1px solid rgba(201,150,12,.2);border-radius:2px;padding:1px 5px;}
  .rnoncanon{font-size:.6rem;color:#888;background:rgba(80,80,80,.15);border:1px solid #333;border-radius:2px;padding:1px 5px;}

  .rchevron{font-size:.68rem;color:var(--text-muted);transition:transform .25s;flex-shrink:0;}
  .row.expanded .rchevron{transform:rotate(180deg);color:var(--gold-light);}

  .rcheck{
    width:26px;height:26px;border:2px solid #2e2e48;border-radius:50%;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    transition:all .18s;font-size:.72rem;background:transparent;cursor:pointer;
  }
  .rcheck:hover{border-color:var(--gold);background:rgba(201,150,12,.1);}
  .row.done .rcheck{background:#3daa3d;border-color:#3daa3d;color:#fff;}

  /* ── DETAIL (sinopse + poster) ── */
  .row-detail{
    overflow:hidden;max-height:0;
    transition:max-height .35s ease, padding .22s ease;
    padding:0 12px 0 12px;
  }
  .row.expanded .row-detail{max-height:320px;padding:0 12px 14px 12px;}

  .detail-inner{
    border-left:2px solid rgba(201,150,12,.3);
    padding-left:12px;
  }

  .sinopse-text{font-size:.78rem;color:rgba(232,232,240,.68);line-height:1.6;font-style:italic;}

  /* ── NEXT ARROW ── */
  .next-arrow{font-size:.72rem;color:var(--gold-light);animation:pulse 1.4s ease-in-out infinite;flex-shrink:0;}
  @keyframes pulse{0%,100%{opacity:.4;transform:translateX(0)}50%{opacity:1;transform:translateX(3px)}}

  /* ── MISC ── */
  .no-results{text-align:center;padding:40px 16px;color:var(--text-muted);font-size:.88rem;display:none;}
  .no-results.visible{display:block;}
  #scroll-top{
    position:fixed;bottom:20px;right:16px;width:38px;height:38px;border-radius:50%;
    background:var(--red-dark);border:1px solid var(--red);color:#fff;font-size:1rem;
    cursor:pointer;display:flex;align-items:center;justify-content:center;
    opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;
    z-index:100;box-shadow:0 2px 16px rgba(227,28,35,.3);
  }
  #scroll-top.visible{opacity:1;pointer-events:auto;}
  #scroll-top:hover{transform:translateY(-3px);background:var(--red);}
  footer{text-align:center;padding:24px 16px;font-size:.68rem;color:var(--text-muted);border-top:1px solid #1a1a28;line-height:1.6;}
</style>
</head>
<body>

<header>
  <div class="header-bg"></div>
  <div class="header-overlay"></div>
  <div class="header-content">

let watched=[];
try{watched=JSON.parse(localStorage.getItem('marvel-v4')||'[]');}catch(e){}
let filt='all',searchQ='',expanded=new Set();

const save=()=>{try{localStorage.setItem('marvel-v4',JSON.stringify(watched));}catch(e){}};

const toggle=(e,id)=>{
  e.stopPropagation();
  watched=watched.includes(id)?watched.filter(x=>x!==id):[...watched,id];
  save();stats();
  const el=document.getElementById('r'+id);
  if(!el)return;
  const done=watched.includes(id);
  el.classList.toggle('done',done);
  el.querySelector('.rcheck').textContent=done?'✓':'';
  updateNextUp();updateEraBars();
};

const expandRow=(id)=>{
  const el=document.getElementById('r'+id);
  if(!el)return;
  if(expanded.has(id)){expanded.delete(id);el.classList.remove('expanded');}
  else{expanded.add(id);el.classList.add('expanded');}
};

const markAll=()=>{watched=[...new Set([...watched,...eras.flatMap(e=>e.items.map(i=>i.id))])];save();render();};
const resetAll=()=>{if(confirm('Reiniciar toda a lista?')){watched=[];save();render();}};

const onSearch=(val)=>{
  searchQ=val.trim().toLowerCase();
  document.getElementById('search-clear').classList.toggle('visible',val.length>0);
  applyVisibility();
};
const clearSearch=()=>{
  searchQ='';document.getElementById('search-input').value='';
  document.getElementById('search-clear').classList.remove('visible');
  applyVisibility();
};

const setFilter=(f,btn)=>{
  filt=f;
  document.querySelectorAll('.fbtn').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');applyVisibility();
};

const applyVisibility=()=>{
  let any=false;
  document.querySelectorAll('.row').forEach(el=>{
    const t=el.dataset.type,done=el.classList.contains('done'),title=el.dataset.title||'';
    const mf=filt==='all'?true:filt==='watched'?done:filt==='unwatched'?!done:t===filt;
    const ms=searchQ===''||title.includes(searchQ);
    const show=mf&&ms;
    el.classList.toggle('hidden',!show);
    if(show)any=true;
  });
  document.querySelectorAll('.era-block').forEach(b=>{
    b.style.display=b.querySelectorAll('.row:not(.hidden)').length?'':'none';
  });
  document.getElementById('no-results').classList.toggle('visible',!any);
};

const updateNextUp=()=>{
  document.querySelectorAll('.row.next-up').forEach(el=>{
    el.classList.remove('next-up');
    const a=el.querySelector('.next-arrow');if(a)a.remove();
  });
  const next=eras.flatMap(e=>e.items).find(i=>!watched.includes(i.id));
  if(!next)return;
  const el=document.getElementById('r'+next.id);
  if(!el)return;
  el.classList.add('next-up');
  const arrow=document.createElement('span');
  arrow.className='next-arrow';arrow.textContent='▶';
  el.querySelector('.row-top').insertBefore(arrow,el.querySelector('.row-top').firstChild);
};

const scrollToNext=()=>{
  const el=document.querySelector('.row.next-up');
  if(el)el.scrollIntoView({behavior:'smooth',block:'center'});
};

const updateEraBars=()=>{
  eras.forEach(era=>{
    const total=era.items.length;
    const done=era.items.filter(i=>watched.includes(i.id)).length;
    const pct=total?Math.round(done/total*100):0;
    const fill=document.getElementById('era-bar-'+era.id);
    const lbl=document.getElementById('era-lbl-'+era.id);
    if(fill)fill.style.width=pct+'%';
    if(lbl)lbl.textContent=`${done}/${total}`;
  });
};

const stats=()=>{
  const total=eras.flatMap(e=>e.items).length;
  const w=watched.length,pct=total?Math.round(w/total*100):0;
  document.getElementById('sc-total').textContent=total;
  document.getElementById('sc-done').textContent=w;
  document.getElementById('sc-left').textContent=total-w;
  document.getElementById('sc-pct').textContent=pct+'%';
  document.getElementById('bar').style.width=pct+'%';
};

const badgeClass=t=>({'filme':'b-film','serie':'b-serie','especial':'b-especial','animacao':'b-animacao','short':'b-short'}[t]||'b-extras');
const badgeLabel=t=>({'filme':'🎬 Filme','serie':'📺 Série','especial':'⭐ Especial','animacao':'🎨 Animação','short':'📎 Short/One-Shot'}[t]||t);

const render=()=>{
  let num=0;
  document.getElementById('root').innerHTML=eras.map(era=>{
    const rows=era.items.map(item=>{
      num++;
      const done=watched.includes(item.id);
      const isExp=expanded.has(item.id);
      const note=item.note?`<span class="rnote">${item.note}</span>`:'';
      const nc=!item.canon?`<span class="rnoncanon">Universo paralelo</span>`:'';

      return `<div class="row${done?' done':''}${isExp?' expanded':''}" id="r${item.id}" data-type="${item.type}" data-title="${item.title.toLowerCase()}" onclick="expandRow(${item.id})">
        <div class="row-top">
          <span class="rnum">${num}</span>
          <span class="rico">${item.icon}</span>
          <div class="rinfo">
            <div class="rtitle">${item.title}</div>
            <div class="rmeta">
              <span class="badge ${badgeClass(item.type)}">${badgeLabel(item.type)}</span>
              <span class="ryear">${item.year}</span>
              <span class="rstream">${item.stream}</span>
              ${note}${nc}
            </div>
          </div>
          <span class="rchevron">▾</span>
          <div class="rcheck" onclick="toggle(event,${item.id})" title="Marcar como assistido">${done?'✓':''}</div>
        </div>
        <div class="row-detail">
          <div class="detail-inner">
<p class="sinopse-text">${item.sinopse}</p>
          </div>
        </div>
      </div>`;
    }).join('');
    const desc=era.desc?`<div class="era-desc">${era.desc}</div>`:'';
    const eraTotal=era.items.length;
    const eraDone=era.items.filter(i=>watched.includes(i.id)).length;
    const eraPct=eraTotal?Math.round(eraDone/eraTotal*100):0;
    return `<div class="era-block">
      <div class="era-header">
        <span class="era-label">${era.label}</span>
        <div class="era-line"></div>
        <span class="era-title">${era.title}</span>
      </div>
      ${desc}
      <div class="era-progress">
        <div class="era-bar-bg"><div class="era-bar-fill" id="era-bar-${era.id}" style="width:${eraPct}%"></div></div>
        <span id="era-lbl-${era.id}">${eraDone}/${eraTotal}</span>
      </div>
      <div class="items">${rows}</div>
    </div>`;
  }).join('');
  stats();updateNextUp();
};

window.addEventListener('scroll',()=>{
  document.getElementById('scroll-top').classList.toggle('visible',window.scrollY>400);
});

render();
</script>
</body>
</html>
