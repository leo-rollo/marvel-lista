<html lang="pt-BR">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lista Marvel — Ordem Cronológica</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:ital,wght@0,300;0,400;0,600;1,300&display=swap');

  :root {
    --red: #E31C23;
    --red-dark: #9B0D12;
    --gold: #C9960C;
    --gold-light: #F5C842;
    --bg: #0A0A0E;
    --surface: #111118;
    --text: #E8E8F0;
    --text-muted: #6060A0;
    --watched-bg: #0f2a0f;
    --watched-border: #2d7a2d;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Barlow', sans-serif;
    font-weight: 300;
    min-height: 100vh;
  }

  header {
    text-align: center;
    padding: 56px 20px 36px;
    background: linear-gradient(180deg, #1a0204 0%, transparent 100%);
    border-bottom: 1px solid #2a0608;
  }

  .shield { font-size: 2.8rem; display: block; margin-bottom: 10px; filter: drop-shadow(0 0 18px rgba(227,28,35,0.5)); }

  h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(2.2rem, 7vw, 4.5rem);
    letter-spacing: 0.08em;
    line-height: 1;
    text-shadow: 0 0 40px rgba(227,28,35,0.25);
  }
  h1 span { color: var(--red); }
  .subtitle { font-size: 0.8rem; letter-spacing: 0.3em; color: var(--text-muted); margin-top: 8px; text-transform: uppercase; }

  .stats-bar {
    display: flex; justify-content: center; gap: 36px;
    padding: 18px 20px; background: var(--surface);
    border-bottom: 1px solid #1e1e2e; flex-wrap: wrap;
  }
  .stat { text-align: center; }
  .stat-num { font-family: 'Bebas Neue', sans-serif; font-size: 1.9rem; color: var(--gold-light); line-height: 1; }
  .stat-lbl { font-size: 0.66rem; letter-spacing: 0.18em; color: var(--text-muted); text-transform: uppercase; }

  .progress-wrap { background: var(--surface); padding: 0 20px 16px; border-bottom: 1px solid #1e1e2e; }
  .bar-bg { background: #1c1c2e; border-radius: 99px; height: 5px; max-width: 760px; margin: 0 auto; overflow: hidden; }
  .bar-fill { height: 100%; background: linear-gradient(90deg, var(--red-dark), var(--red), var(--gold)); border-radius: 99px; transition: width .5s ease; }

  .controls {
    display: flex; gap: 8px; padding: 14px 16px;
    justify-content: center; flex-wrap: wrap;
    background: var(--surface); border-bottom: 1px solid #1e1e2e;
    position: sticky; top: 0; z-index: 10;
  }
  .fbtn {
    background: transparent; border: 1px solid #2e2e48;
    color: var(--text-muted); padding: 6px 14px; border-radius: 3px;
    cursor: pointer; font-family: 'Barlow', sans-serif;
    font-size: 0.74rem; letter-spacing: 0.08em; text-transform: uppercase; transition: all .18s;
  }
  .fbtn:hover, .fbtn.on { border-color: var(--red); color: var(--text); background: rgba(227,28,35,.1); }
  .abtn {
    padding: 6px 14px; border-radius: 3px; cursor: pointer;
    font-family: 'Barlow', sans-serif; font-size: 0.74rem;
    letter-spacing: 0.08em; text-transform: uppercase; transition: all .18s;
    border: 1px solid; 
  }
  .abtn.green { background: rgba(45,122,45,.12); border-color: #2d7a2d; color: #6ec46e; }
  .abtn.green:hover { background: rgba(45,122,45,.28); }
  .abtn.crimson { background: rgba(227,28,35,.08); border-color: var(--red-dark); color: #d06060; }
  .abtn.crimson:hover { background: rgba(227,28,35,.18); }

  /* ERA divider */
  .era-block { max-width: 880px; margin: 0 auto; }

  .era-header {
    display: flex; align-items: center; gap: 14px;
    padding: 28px 16px 10px;
  }
  .era-label {
    font-family: 'Bebas Neue', sans-serif; font-size: 0.85rem;
    letter-spacing: 0.2em; color: var(--red); white-space: nowrap;
  }
  .era-line { flex: 1; height: 1px; background: linear-gradient(90deg, var(--red-dark), transparent); }
  .era-title {
    font-family: 'Bebas Neue', sans-serif; font-size: 1.5rem;
    letter-spacing: 0.1em; white-space: nowrap;
  }

  .era-desc {
    font-size: 0.72rem; color: var(--text-muted); font-style: italic;
    padding: 0 16px 8px; border-left: 2px solid #2a2a40; margin: 0 16px 4px;
  }

  /* Items */
  .items { display: flex; flex-direction: column; gap: 3px; padding: 0 14px 20px; }

  .row {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 14px; background: var(--surface);
    border: 1px solid #1c1c2c; border-left: 3px solid transparent;
    border-radius: 3px; cursor: pointer; transition: all .18s; position: relative;
  }
  .row:hover { border-color: #28283c; border-left-color: var(--red); background: #13131c; }
  .row.done { background: var(--watched-bg); border-color: #1e451e; border-left-color: #3daa3d; }
  .row.done .rtitle { color: #8ccc8c; }
  .row.done .rnum { color: #3daa3d; }
  .row.hidden { display: none; }

  .rnum { font-family: 'Bebas Neue', sans-serif; font-size: 1rem; color: var(--text-muted); min-width: 26px; text-align: right; flex-shrink: 0; }
  .rico { font-size: 1rem; width: 20px; text-align: center; flex-shrink: 0; }
  .rinfo { flex: 1; min-width: 0; }
  .rtitle { font-size: 0.9rem; font-weight: 600; line-height: 1.2; }
  .rmeta { display: flex; align-items: center; gap: 7px; margin-top: 3px; flex-wrap: wrap; }

  .badge {
    font-size: 0.62rem; letter-spacing: 0.1em; text-transform: uppercase;
    padding: 1px 6px; border-radius: 2px; font-weight: 700;
  }
  .b-film { background: rgba(227,28,35,.18); color: #ff7070; }
  .b-serie { background: rgba(110,80,220,.2); color: #b0a0ff; }
  .b-especial { background: rgba(201,150,12,.18); color: var(--gold-light); }
  .b-animacao { background: rgba(0,160,210,.18); color: #70d8ff; }
  .b-extras { background: rgba(80,80,80,.25); color: #aaaacc; }

  .ryear { font-size: 0.7rem; color: var(--text-muted); }
  .rstream { font-size: 0.65rem; color: var(--text-muted); font-style: italic; }
  .rnote { font-size: 0.62rem; color: var(--gold); background: rgba(201,150,12,.1); border: 1px solid rgba(201,150,12,.2); border-radius: 2px; padding: 1px 5px; }
  .rnoncanon { font-size: 0.62rem; color: #888; background: rgba(80,80,80,.15); border: 1px solid #333; border-radius: 2px; padding: 1px 5px; }

  .rcheck {
    width: 20px; height: 20px; border: 2px solid #2e2e48;
    border-radius: 50%; flex-shrink: 0; display: flex;
    align-items: center; justify-content: center;
    transition: all .18s; font-size: 0.65rem;
  }
  .row:hover .rcheck { border-color: var(--red); }
  .row.done .rcheck { background: #3daa3d; border-color: #3daa3d; color: #fff; }

  footer { text-align: center; padding: 28px; font-size: 0.72rem; color: var(--text-muted); border-top: 1px solid #1a1a28; }
</style>

      {id:77, title:"Spider-Man 3", type:"filme", year:"2007", icon:"🕷️", stream:"Disney+", canon:false, note:"Universo Raimi"},
      {id:78, title:"O Espetacular Homem-Aranha (Andrew Garfield)", type:"filme", year:"2012", icon:"🕷️", stream:"Disney+", canon:false, note:"Universo ASM — Terra-120703"},
      {id:79, title:"O Espetacular Homem-Aranha 2", type:"filme", year:"2014", icon:"🕷️", stream:"Disney+", canon:false, note:"Universo ASM"},
      {id:80, title:"Homem-Aranha no Aranhaverso", type:"animacao", year:"2018", icon:"🕷️", stream:"Netflix", canon:false, note:"Universo animado Sony — Miles Morales"},
      {id:81, title:"Venom", type:"filme", year:"2018", icon:"🖤", stream:"Disney+", canon:false, note:"SSU Sony — Terra-688"},
      {id:82, title:"Venom: Tempo de Carnificina", type:"filme", year:"2021", icon:"🖤", stream:"Disney+", canon:false, note:"SSU Sony — pós-crédito conecta ao MCU"},
      {id:83, title:"Morbius", type:"filme", year:"2022", icon:"🦇", stream:"Disney+", canon:false, note:"SSU Sony"},
      {id:84, title:"Homem-Aranha: Através do Aranhaverso", type:"animacao", year:"2023", icon:"🕷️", stream:"Netflix", canon:false, note:"Referencia o MCU (Terra-199999)"},
      {id:85, title:"Venom: A Última Rodada", type:"filme", year:"2024", icon:"🖤", stream:"Disney+", canon:false, note:"SSU Sony"},
      {id:86, title:"Homem-Aranha: Além do Aranhaverso", type:"animacao", year:"2027", icon:"🕷️", stream:"Cinemas", canon:false, note:"Em produção — conclusão da trilogia animada"},
    ]
  }
];

// ─── STATE ───────────────────────────────────────────────────────────────────
let watched = [];
try { watched = JSON.parse(localStorage.getItem('marvel-v3') || '[]'); } catch(e){}
let filt = 'all';

const save = () => { try { localStorage.setItem('marvel-v3', JSON.stringify(watched)); } catch(e){} };

const toggle = (id) => {
  watched = watched.includes(id) ? watched.filter(x=>x!==id) : [...watched, id];
  save(); stats();
  const el = document.getElementById('r'+id);
  if (!el) return;
  el.classList.toggle('done', watched.includes(id));
  el.querySelector('.rcheck').textContent = watched.includes(id) ? '✓' : '';
};

const markAll = () => {
  watched = [...new Set([...watched, ...eras.flatMap(e=>e.items.map(i=>i.id))])];
  save(); render();
};
const resetAll = () => { if(confirm('Reiniciar toda a lista?')){ watched=[]; save(); render(); } };

const setFilter = (f, btn) => {
  filt = f;
  document.querySelectorAll('.fbtn').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  document.querySelectorAll('.row').forEach(el=>{
    const t = el.dataset.type, done = el.classList.contains('done');
    const show = f==='all' ? true : f==='watched' ? done : f==='unwatched' ? !done : t===f;
    el.classList.toggle('hidden', !show);
  });
  document.querySelectorAll('.era-block').forEach(b=>{
    b.style.display = b.querySelectorAll('.row:not(.hidden)').length ? '' : 'none';
  });
};

const stats = () => {
  const total = eras.flatMap(e=>e.items).length;
  const w = watched.length;
  const pct = total ? Math.round(w/total*100) : 0;
  document.getElementById('sc-total').textContent = total;
  document.getElementById('sc-done').textContent = w;
  document.getElementById('sc-left').textContent = total-w;
  document.getElementById('sc-pct').textContent = pct+'%';
  document.getElementById('bar').style.width = pct+'%';
};

const badgeClass = t => ({'filme':'b-film','serie':'b-serie','especial':'b-especial','animacao':'b-animacao'}[t]||'b-extras');
const badgeLabel = t => ({'filme':'🎬 Filme','serie':'📺 Série','especial':'⭐ Especial','animacao':'🎨 Animação'}[t]||t);

const render = () => {
  let num = 0;
  const root = document.getElementById('root');
  root.innerHTML = eras.map(era=>{
    const rows = era.items.map(item=>{
      num++;
      const done = watched.includes(item.id);
      const note = item.note ? `<span class="rnote">${item.note}</span>` : '';
      const nc = !item.canon ? `<span class="rnoncanon">Universo paralelo</span>` : '';
      return `<div class="row${done?' done':''}" id="r${item.id}" data-type="${item.type}" onclick="toggle(${item.id})">
        <span class="rnum">${num}</span>
        <span class="rico">${item.icon}</span>
        <div class="rinfo">
          <div class="rtitle">${item.title}</div>
          <div class="rmeta">
            <span class="badge ${badgeClass(item.type)}">${badgeLabel(item.type)}</span>
            <span class="ryear">${item.year}</span>
            <span class="rstream">${item.stream}</span>
            ${note}${nc}
          </div>
        </div>
        <div class="rcheck">${done?'✓':''}</div>
      </div>`;
    }).join('');

    const desc = era.desc ? `<div class="era-desc">${era.desc}</div>` : '';

    return `<div class="era-block">
      <div class="era-header">
        <span class="era-label">${era.label}</span>
        <div class="era-line"></div>
        <span class="era-title">${era.title}</span>
      </div>
      ${desc}
      <div class="items">${rows}</div>
    </div>`;
  }).join('');
  stats();
};

render();
</script>
</body>
</html>
